/* One-screen responsive game: never require page scrolling. */
html,body{height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
.top{width:100%;flex:0 0 auto;padding:7px 12px}
.top .logo{font-size:clamp(20px,3vw,27px)}
.top button{padding:7px 10px;font-size:12px}
.shell{width:100%;flex:1 1 auto;min-height:0;overflow:hidden;padding:0 9px 7px;grid-template-columns:minmax(0,1fr) minmax(130px,190px);gap:8px}
.stage{min-height:0;height:100%;overflow:hidden;padding:clamp(8px,1.5vh,15px);gap:clamp(5px,1.3vh,12px);border-radius:16px}
.orb{width:clamp(55px,13vh,115px);height:clamp(55px,13vh,115px);font-size:clamp(24px,6vh,42px);border-width:2px;flex:0 1 auto;min-height:0;aspect-ratio:1}
.question{min-height:0;flex:1 1 auto;padding:8px 12px;font-size:clamp(15px,2.5vh,23px);line-height:1.23}
.answers{gap:clamp(4px,1vh,9px);flex:0 0 auto}
.answer{min-height:clamp(42px,8vh,65px);padding:7px 10px;font-size:clamp(12px,1.9vh,16px);border-radius:10px}
.helpers{gap:5px;flex:0 0 auto}
.helpers button{padding:7px 5px;min-width:0;flex:1;font-size:clamp(10px,1.7vh,13px)}
.status{min-height:0;font-size:clamp(11px,1.7vh,14px);line-height:1.2}
.bottom{flex:0 0 auto}
.bottom button{padding:7px}
.side{height:100%;min-height:0;overflow:hidden;padding:7px}
.side h3{font-size:13px;margin-bottom:5px}
.ladder{height:calc(100% - 23px);grid-template-rows:repeat(15,minmax(0,1fr));gap:1px}
.step{padding:0 6px;align-items:center;font-size:clamp(9px,1.7vh,12px)}
footer{display:none}
@media(max-width:760px){
